обязательно подберем вакансию для вас!&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Трудоустройство на следующий день после обращения&lt;/strong&gt;&lt;strong&gt;! Пройти собеседование можно в любом удобном для вас магазине Fix Price в любой день недели с 9:00 до 18:00.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;При себе необходимо иметь паспорт, трудовую книжку и военный билет или приписное свидетельство (для военнообязанных).&lt;/p&gt; &lt;p&gt;С радостью рассмотрим кандидатов, которые работали в других торговых сетях (Магнит, Пятёрочка, Перекрёсток, Красное&amp;amp;Белое, Бристоль, Дикси, Лента, Ашан, Глобус, Светофор, Магнит Косметик, Верный, О&amp;#39;КЕЙ, Детский мир, Спортмастер, Лэтуаль, Кораблик, Читай-город, Галамарт, Леруа Мерлен, Сбермаркет, Самокат, Яндекс, Чижик, ВкусВилл).&lt;/p&gt;&#34;,&#34;keySkills&#34;:null,&#34;employmentForm&#34;:&#34;FULL&#34;,&#34;professionalRoleIds&#34;:[9],&#34;closedForApplicants&#34;:false}}</template>
