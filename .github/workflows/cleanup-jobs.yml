name: SteppeUp Stale Job Cleanup

# Standalone cleanup so dead listings still get retired if scraping is paused.
# Passes: per-source TTL expiry → liveness verify (circuit-broken) → self-heal
# → garbage sweep against current filter rules. Never deletes on ambiguity.

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC ≈ 08:30 Almaty
  workflow_dispatch: {}

concurrency:
  group: steppeup-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd scraper && npm install --omit=dev --no-audit --no-fund
      - name: Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: cd scraper && node cleanup-jobs.js
