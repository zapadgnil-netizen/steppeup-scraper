name: SteppeUp Telegram Career Scraper

# Scrapes university career-center Telegram channels every 8 hours and feeds
# student-suitable jobs into Supabase. Runs alongside the main scrape-jobs.js.
#
# NOTE: GitHub Actions only runs workflows located at the REPOSITORY ROOT
# (.github/workflows/). The older scrape-jobs.js workflow under scraper/.github
# is NOT picked up from that path — consider moving it here too.

on:
  schedule:
    - cron: '0 */8 * * *'   # every 8 hours (00:00, 08:00, 16:00 UTC)
  workflow_dispatch: {}      # manual trigger from the Actions tab

jobs:
  scrape-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: cd scraper && npm install

      - name: Run Telegram scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd scraper && node telegram/index.js

      - name: Log result
        if: always()
        run: echo "Telegram scraper finished at $(date -u)"
