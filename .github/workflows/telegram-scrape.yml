name: SteppeUp Telegram Career Scraper

# Telegram is now a source module (scraper/sources/telegram.js) and runs inside
# the main scraper. This workflow keeps career-channel posts fresh between full
# runs — channels post during the day and students expect same-day listings.

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: {}

concurrency:
  group: steppeup-telegram
  cancel-in-progress: false

jobs:
  scrape-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install dependencies
        run: cd scraper && npm ci --omit=dev || npm install --omit=dev
      - name: Scrape Telegram channels only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: cd scraper && node scrape-jobs.js --only=telegram_career
