name: SteppeUp Daily Job Scraper

# Scrapes every source in scraper/sources/ into Supabase, then runs cleanup so
# the board is refreshed and pruned in one pass. Runs 4x/day: KZ job sites post
# through the working day and a 24h-old board looks stale to students.
#
# The run FAILS (and GitHub emails) when the board drops below the health floor
# or a write cannot be verified; it reports "degraded" when a single source
# under-delivers. Silent green runs on a broken source are the failure mode this
# whole pipeline is designed around — see scraper/SPEC.md.

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'   # 01/07/13/19 UTC ≈ 06/12/18/00 Almaty
  workflow_dispatch: {}

concurrency:
  group: steppeup-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: deps
        run: cd scraper && npm install --omit=dev --no-audit --no-fund

      - name: Unit tests (parsers must still understand today's page shapes)
        run: cd scraper && npm test

      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: cd scraper && node scrape-jobs.js

      - name: Cleanup (expiry, liveness, self-heal, garbage sweep)
        if: always() && steps.deps.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
        run: cd scraper && node cleanup-jobs.js
