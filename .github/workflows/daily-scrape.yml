name: SteppeUp Daily Job Scraper

# Scrapes fresh student jobs (hh.kz via HTML+JSON, enbek, etc.) into Supabase.
# Must live at the repo root (.github/workflows/) — GitHub Actions ignores
# workflows under subdirectories, which is why the old scraper/.github copy
# never ran. Pairs with cleanup-jobs.yml (removes stale) for a self-maintaining board.

on:
  schedule:
    - cron: '0 1 * * *'    # daily at 01:00 UTC (~06:00 Almaty), before the 02:30 cleanup
  workflow_dispatch: {}      # manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd scraper && npm install

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd scraper && node scrape-jobs.js

      - name: Log result
        if: always()
        run: echo "Scraper finished at $(date -u)"
